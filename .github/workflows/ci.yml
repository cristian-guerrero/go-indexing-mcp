name: ci

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          go-version-file: go.mod
      - uses: mlugg/setup-zig@v2
      - name: Pre-download sqlite-vec extension
        run: |
          mkdir -p ~/.go-mcp/indexing/lib
          curl -fsSL "https://github.com/asg017/sqlite-vec/releases/download/v0.1.9/sqlite-vec-0.1.9-loadable-linux-x86_64.tar.gz" \
            -o /tmp/vec0.tar.gz
          tar -xzf /tmp/vec0.tar.gz -C ~/.go-mcp/indexing/lib
      - run: CGO_ENABLED=1 CC="zig cc" go vet -tags "onnx sqlite_fts5" ./...
      - run: CGO_ENABLED=1 CC="zig cc" go test -count=1 -tags "onnx sqlite_fts5" ./...

  build:
    needs: test
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          go-version-file: go.mod
      - if: matrix.os != 'macos-latest'
        uses: mlugg/setup-zig@v2
      - name: Determine build version
        id: version
        shell: bash
        run: |
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          echo "name=b${BUILD_NUMBER}" >> $GITHUB_OUTPUT
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.os == 'macos-latest' && 'clang' || 'zig cc' }}
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -tags "onnx sqlite_fts5" \
            -ldflags="-s -w -X github.com/cristian-guerrero/go-indexing-mcp/pkg/version.Version=${{ steps.version.outputs.name }}" \
            -o "go-indexing-mcp-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" .
      - uses: actions/upload-artifact@v4
        with:
          name: go-indexing-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: go-indexing-mcp-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine tag
        id: tag
        shell: bash
        run: |
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          echo "name=b${BUILD_NUMBER}" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          pattern: go-indexing-mcp-*
          merge-multiple: true
          path: release
      - name: Generate checksums
        working-directory: ./release
        run: sha256sum * > checksums.txt
      - name: Create Release
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$(git log -1 --format='%s')"
          gh release upload "$TAG" release/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
